version: '3.8'

services:
  app-worker-1:
    build:
      context: ./src
      dockerfile: dockerfile
    image: multi-replicas:latest
    environment:
      - INSTANCE_ID=replica_1
  
  app-worker-2:
    image: multi-replicas:latest
    depends_on:
      - app-worker-1
    environment:
      - INSTANCE_ID=replica_2
  
  app-worker-3:
    image: multi-replicas:latest
    depends_on:
      - app-worker-1
    environment:
      - INSTANCE_ID=replica_3
  
